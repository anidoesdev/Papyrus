# HTTP-only config used ONLY for the first Let's Encrypt certificate issuance.
# nginx/conf.d/app.conf references cert files that do not exist yet, so nginx
# cannot start with it until certbot has run once. Serve the ACME challenge
# with this, get the cert, then switch to the real config.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'awaiting certificate issuance\n';
        add_header Content-Type text/plain;
    }
}
