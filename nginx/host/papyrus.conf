# Papyrus — host nginx site (VM shared with other projects).
#
# Requires the VM-wide common files from DEPLOY.md Part 1:
#   /etc/nginx/conf.d/00-common.conf          ($ws_connection map)
#   /etc/nginx/snippets/common-proxy.conf
#   /etc/nginx/snippets/common-security.conf
#
# Install:  sudo cp nginx/host/papyrus.conf /etc/nginx/sites-available/papyrus
#           sudo ln -s /etc/nginx/sites-available/papyrus /etc/nginx/sites-enabled/papyrus
#
# HTTP-only on purpose: `certbot --nginx` rewrites the installed copy to add the
# 443 listeners, certificate paths and HTTP→HTTPS redirect. After that the
# installed file and this one differ — see DEPLOY.md "Change the nginx site".
#
# Ports must match API_PORT / FRONTEND_PORT in the project's .env.

# /api/ask is public and every uncached call spends OpenAI credits, so cap it
# per client IP. Zone is papyrus-only so other projects never share its counter.
# (Site files are included inside nginx's http{} block, so this is valid here.)
limit_req_zone $binary_remote_addr zone=papyrus_ask:10m rate=10r/m;

# ── Frontend (Next.js container → 127.0.0.1:3100) ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name papyrus.anidoes.dev;

    access_log /var/log/nginx/papyrus.access.log;
    error_log  /var/log/nginx/papyrus.error.log;

    include snippets/common-security.conf;

    location / {
        proxy_pass http://127.0.0.1:3100;
        include snippets/common-proxy.conf;
    }
}

# ── Backend API (FastAPI container → 127.0.0.1:8100) ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.papyrus.anidoes.dev;

    access_log /var/log/nginx/papyrus-api.access.log;
    error_log  /var/log/nginx/papyrus-api.error.log;

    include snippets/common-security.conf;

    client_max_body_size 50M;   # PDF uploads

    # Retrieval + rerank + generation can exceed nginx's 60 s default (→ 504).
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location = /api/ask {
        # ~10 questions/min per IP, short bursts of 5 allowed; excess → 429.
        limit_req        zone=papyrus_ask burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        include snippets/common-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        include snippets/common-proxy.conf;
    }
}
