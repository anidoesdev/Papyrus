
# ── Scientific RAG Assistant – full local stack ──────────────────────────────
#
#  Services:
#    db       – PostgreSQL 16 + pgvector
#    redis    – Redis 7 (answer cache)
#    api      – FastAPI backend  → http://localhost:8000
#    frontend – Next.js 16       → http://localhost:3000
#
#  Prerequisites:
#    • .env file at project root with OPENAI_API_KEY set (see .env.example)
#
#  First-time setup:
#    docker compose up -d db redis
#    # wait ~5 s for Postgres to initialise init.sql
#    docker compose up -d api frontend
#
#  Quick start (all at once):
#    docker compose up --build
# ---------------------------------------------------------------------------

# Docker keeps container logs forever by default; on a shared VM that
# eventually fills the disk. Cap each container at 3 x 10 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_pg
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER:     raguser
      # Set a strong POSTGRES_PASSWORD in .env on servers; applied only when the
      # data volume is first initialised.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      POSTGRES_DB:       ragdb
    ports:
      - "127.0.0.1:5732:5432"  # localhost only – not exposed publicly
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # runs once on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"  # localhost only
    volumes:
      - rag_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_api
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Localhost-only: the host nginx proxies api.<domain> → 127.0.0.1:8100.
    # 8100 (not 8000) to avoid colliding with other apps on a shared VM.
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    volumes:
      # Uploaded / pre-existing PDFs persist across container restarts
      - rag_data:/app/data
    environment:
      # ── Database (internal hostname = service name) ──
      DB_HOST:     db
      DB_PORT:     5432        # internal port, NOT 5732
      DB_USER:     raguser
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ragpassword}
      DB_NAME:     ragdb

      # ── Redis ──
      REDIS_HOST:  redis
      REDIS_PORT:  6379

      # ── OpenAI ──
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # ── Auth ──
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    env_file:
      - .env          # fallback / additional secrets; DB/Redis above take precedence

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle – must point to where the BROWSER reaches the API.
        # For local docker-compose this is always localhost:8000.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: rag_frontend
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - api
    # Localhost-only: the host nginx proxies <domain> → 127.0.0.1:3100.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"

  # ── Nginx reverse proxy + SSL termination (opt-in) ────────────────────────
  # Only for a dedicated VM with NO host nginx. On a VM that already runs nginx
  # for other sites, use nginx/host/papyrus.conf instead (see DEPLOY.md) — this
  # container would fail to bind 80/443. Enable with:
  #   docker compose --profile docker-nginx up -d
  nginx:
    profiles: ["docker-nginx"]
    image: nginx:alpine
    container_name: rag_nginx
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro   # ACME http-01 challenge webroot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend
    # certbot renews certs on disk but cannot signal this container, so reload
    # every 12 h to pick up a renewed certificate.
    command: >
      /bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'

  # ── Certbot – automatic certificate renewal ──────────────────────────
  # Wakes every 12 h; certbot only acts when a cert is within 30 days of expiry.
  # Initial issuance is done manually once — see DEPLOY.md appendix.
  certbot:
    profiles: ["docker-nginx"]
    image: certbot/certbot
    container_name: rag_certbot
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot          # rw: certbot writes the challenge
      - /etc/letsencrypt:/etc/letsencrypt       # rw: certbot writes renewed certs
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  rag_pg_data:
  rag_redis_data:
  rag_data:       # shared data/ dir between host and api container
